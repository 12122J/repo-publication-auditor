  <text x="250" y="133" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display'" font-size="18" fill="#f2f2f7" font-weight="600">AWS access key found in git history</text>

  <!-- Location block -->
  <text x="250" y="168" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="9" fill="#636366" font-weight="600" letter-spacing="0.6">LOCATION</text>
  <rect x="250" y="176" width="620" height="38" rx="6" fill="#2c2c2e" fill-opacity="0.7"/>
  <rect x="250" y="176" width="620" height="38" rx="6" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="263" y="199" font-family="-apple-system,BlinkMacSystemFont,'SF Mono',monospace" font-size="12" fill="#ebebf5">commit a3f2b9c4 → .env (deleted)</text>

  <!-- Details block -->
  <text x="250" y="237" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="9" fill="#636366" font-weight="600" letter-spacing="0.6">DETAILS</text>
  <text x="250" y="256" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="13" fill="#ebebf5">An AWS access key ID matching the pattern AKIA[A-Z0-9]{16} was found in</text>
  <text x="250" y="274" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="13" fill="#ebebf5">commit a3f2b9c4. The file was later deleted, but it remains accessible in git</text>
  <text x="250" y="292" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="13" fill="#ebebf5">history. Anyone who clones this repo can recover it with a single command.</text>
  <text x="250" y="318" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="13" fill="#ebebf5">Key prefix (last shown before deletion): <tspan font-family="-apple-system,BlinkMacSystemFont,'SF Mono',monospace" fill="#ff9500">AKIA••••••••••••XXYZ</tspan></text>

  <!-- Remediation block -->
  <text x="250" y="354" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="9" fill="#636366" font-weight="600" letter-spacing="0.6">REMEDIATION</text>
  <rect x="250" y="362" width="620" height="104" rx="6" fill="#2c2c2e" fill-opacity="0.7"/>
  <rect x="250" y="362" width="620" height="104" rx="6" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="265" y="383" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="12.5" fill="#ebebf5">1.  Revoke the key in the AWS IAM console immediately — even after</text>
  <text x="265" y="401" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="12.5" fill="#ebebf5">    you rewrite history the key may already have been harvested.</text>
  <text x="265" y="422" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="12.5" fill="#ebebf5">2.  Rewrite history with <tspan font-family="-apple-system,BlinkMacSystemFont,'SF Mono',monospace" fill="#ff9500">git filter-repo --path .env --invert-paths</tspan></text>
  <text x="265" y="440" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="12.5" fill="#ebebf5">3.  Add <tspan font-family="-apple-system,BlinkMacSystemFont,'SF Mono',monospace" fill="#ff9500">.env</tspan> to <tspan font-family="-apple-system,BlinkMacSystemFont,'SF Mono',monospace" fill="#ff9500">.gitignore</tspan> before creating the new key.</text>
  <text x="265" y="458" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="12.5" fill="#ebebf5">4.  Store secrets in environment variables or a secrets manager.</text>

  <!-- Pagination hint -->
