  <text x="545" y="318" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="10.5" fill="#8e8e93">Secure temp clone</text>

  <circle cx="430" cy="332" r="2" fill="#48484a"/>
  <text x="437" y="336" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="10.5" fill="#8e8e93">Markdown export</text>
  <circle cx="538" cy="332" r="2" fill="#48484a"/>
  <text x="545" y="336" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="10.5" fill="#8e8e93">All findings</text>

  <circle cx="430" cy="350" r="2" fill="#48484a"/>
  <text x="437" y="354" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="10.5" fill="#8e8e93">Filters by category</text>
