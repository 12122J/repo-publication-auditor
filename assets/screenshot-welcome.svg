  <!-- Traffic lights -->
  <circle cx="20" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="56" cy="20" r="5.5" fill="#28c840"/>

  <!-- Toolbar title -->
  <text x="380" y="25" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text'" font-size="12.5" fill="#8e8e93" font-weight="500">Repo Auditor</text>

